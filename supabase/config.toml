# Edge Function gateway authentication policy.
# Public onboarding/recovery endpoints intentionally manage their own access model.
# Privileged administrative endpoints require Supabase JWT verification at the gateway
# in addition to the authorization checks implemented inside each function.

[functions.manage-organization-user]
verify_jwt = true

[functions.platform-create-hospital]
verify_jwt = true

[functions.process-notification-outbox]
verify_jwt = true

[functions.platform-delete-organizations]
verify_jwt = true

[functions.platform-housekeeping]
verify_jwt = true

[functions.platform-export-organization]
verify_jwt = true

# Scheduler-secret endpoint (pg_net, no user JWT): checks platform_scheduler_secret_valid itself.
[functions.filemaker-staging-purge]
verify_jwt = false

# Scheduler-secret endpoint (pg_net, no user JWT): fills the Library «Νέα» tab.
[functions.library-news-ingest]
verify_jwt = false

# Public: the e-mailed supplier link (single-use token checked inside the function).
[functions.supplier-certificate-submit]
verify_jwt = false
