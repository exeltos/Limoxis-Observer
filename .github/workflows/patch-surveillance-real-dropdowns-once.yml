name: Patch surveillance real dropdowns once

on:
  push:
    branches:
      - fix/surveillance-real-dropdowns

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-real-dropdowns
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Repair clinical library selectors
        shell: python
        run: |
          from pathlib import Path

          path=Path('src/features/surveillance/NewSurveillanceFlow.jsx')
          text=path.read_text()
          if 'function LibraryChecklist(' not in text:
              component=r'''
function LibraryChecklist({title,rows,selected,onToggle,language}){
  const [open,setOpen]=useState(false)
  const [query,setQuery]=useState('')
  const selectedRows=rows.filter(row=>selected.includes(libraryValue(row)))
  const normalizedQuery=query.trim().toLocaleLowerCase()
  const filtered=rows.filter(row=>{
    const label=language==='el'?(row[0]||row[1]):(row[1]||row[0])
    return !normalizedQuery||String(label||'').toLocaleLowerCase().includes(normalizedQuery)
  })
  const summary=selectedRows.length
    ? `${selectedRows.length} ${language==='el'?'επιλεγμένα':'selected'}`
    : (language==='el'?'Επιλέξτε από τη λίστα':'Select from list')
  return <section className="clinical-checklist library-checklist clinical-library-multiselect">
    <h4>{title}</h4>
    <button type="button" className="clinical-library-trigger" aria-expanded={open} onClick={()=>setOpen(value=>!value)}>
      <span>{summary}</span><span className={open?'open':''} aria-hidden="true">⌄</span>
    </button>
    {open&&<div className="clinical-library-menu">
      <input className="clinical-library-search" value={query} onChange={event=>setQuery(event.target.value)} placeholder={language==='el'?'Αναζήτηση...':'Search...'} autoFocus/>
      <div className="clinical-library-options">
        {filtered.map(row=>{const value=libraryValue(row);const label=language==='el'?(row[0]||row[1]):(row[1]||row[0]);return <label key={value} className={selected.includes(value)?'selected':''}><input type="checkbox" checked={selected.includes(value)} onChange={()=>onToggle(value)}/><span>{label}</span></label>})}
        {!filtered.length&&<div className="clinical-library-empty">{language==='el'?'Δεν βρέθηκαν επιλογές':'No options found'}</div>}
      </div>
    </div>}
    {selectedRows.length>0&&<div className="clinical-library-selected">
      {selectedRows.map(row=>{const value=libraryValue(row);const label=language==='el'?(row[0]||row[1]):(row[1]||row[0]);return <button type="button" key={value} onClick={()=>onToggle(value)} title={language==='el'?'Αφαίρεση':'Remove'}>{label}<span aria-hidden="true">×</span></button>})}
    </div>}
  </section>
}
'''
              anchor='\nexport function NewSurveillanceFlow'
              if anchor not in text:
                  raise SystemExit('NewSurveillanceFlow export anchor not found')
              text=text.replace(anchor,'\n'+component+anchor,1)
              path.write_text(text)

          css=Path('src/styles/surveillance-workflow-preview.css')
          styles=css.read_text()
          marker='/* Clinical library compact multi-select */'
          rules=r'''

/* Clinical library compact multi-select */
.library-clinical-grid{align-items:start}
.clinical-library-multiselect{position:relative;min-width:0;border:0!important;background:transparent!important;padding:0!important;overflow:visible!important}
.clinical-library-multiselect>h4{margin:0 0 7px;font-size:14px;color:#163a53}
.clinical-library-trigger{width:100%;min-height:44px;border:1px solid #cbd9e4;border-radius:9px;background:#fff;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#173b55;text-align:left;cursor:pointer;font:inherit}
.clinical-library-trigger:hover,.clinical-library-trigger[aria-expanded="true"]{border-color:#79acd0;box-shadow:0 0 0 2px rgba(34,124,178,.08)}
.clinical-library-trigger>span:last-child{font-size:20px;line-height:1;transition:transform .15s ease}
.clinical-library-trigger>span:last-child.open{transform:rotate(180deg)}
.clinical-library-menu{position:absolute;z-index:80;left:0;right:0;top:70px;background:#fff;border:1px solid #bfd2df;border-radius:10px;box-shadow:0 14px 32px rgba(20,55,75,.18);padding:8px}
.clinical-library-search{box-sizing:border-box;width:100%;height:38px;border:1px solid #d4e0e8;border-radius:7px;padding:0 10px;margin:0 0 6px!important;background:#fff}
.clinical-library-options{max-height:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.clinical-library-options label{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;min-height:36px!important;padding:6px 8px!important;border:0!important;border-radius:6px!important;background:#fff!important;cursor:pointer!important;text-align:left!important}
.clinical-library-options label:hover,.clinical-library-options label.selected{background:#f1f7fa!important}
.clinical-library-options label input{width:auto!important;height:auto!important;margin:0!important;flex:0 0 auto!important}
.clinical-library-options label span{display:block!important;text-align:left!important;margin:0!important}
.clinical-library-empty{padding:12px;color:#708696;font-size:13px}
.clinical-library-selected{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.clinical-library-selected button{border:0;border-radius:999px;background:#eef5f8;color:#365b70;font-size:11px;padding:4px 8px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.clinical-library-selected button:hover{background:#e1edf3}
@media(max-width:900px){.library-clinical-grid{grid-template-columns:1fr}.clinical-library-menu{position:relative;top:auto;margin-top:4px}}
'''
          if marker not in styles:
              css.write_text(styles+rules)
      - name: Test and build
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commit repaired UI and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-surveillance-real-dropdowns-once.yml
          git add src/features/surveillance/NewSurveillanceFlow.jsx src/styles/surveillance-workflow-preview.css
          git diff --cached --check
          git commit -m "Fix surveillance clinical library dropdowns"
          git push origin HEAD:fix/surveillance-real-dropdowns

# trigger 2026-09-14