name: Surveillance layout patch runner
on:
  push:
    branches:
      - fix/surveillance-group-layout-actions
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-group-layout-actions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          s=p.read_text()
          a="return <SampleTree samples={unlinked} linked={false}"
          b="return unlinked.length?<div className=\"surveillance-independent-samples\"><SampleTree samples={unlinked} linked={false}"
          if a not in s: raise SystemExit('unlinked start missing')
          s=s.replace(a,b,1)
          a="t={t} language={language} fmtDate={fmtDate}/>})()}{!episodes.length"
          b="t={t} language={language} fmtDate={fmtDate}/></div>:null})()}{!episodes.length"
          if a not in s: raise SystemExit('unlinked end missing')
          s=s.replace(a,b,1)
          a='<span><i aria-hidden="true">↳</i><span><strong>{fmtDate(sample.collectedAt||sample.requestedAt)}</strong>'
          b='<span>{depth>0&&<i aria-hidden="true">↳</i>}<span><strong>{fmtDate(sample.collectedAt||sample.requestedAt)}</strong>'
          if a not in s: raise SystemExit('arrow missing')
          s=s.replace(a,b,1)
          s=s.replace("<span style={{display:'flex',gap:5,alignItems:'center',overflow:'visible'}}>",'<span className="surveillance-sample-actions">',1)
          s=s.replace('<Button variant="ghost" onClick={()=>onCreateFromSample?.(sample)}><PlayCircle size={14}/>','<Button className="sample-start-action" variant="secondary" onClick={()=>onCreateFromSample?.(sample)}><PlayCircle size={14}/>',1)
          s=s.replace('<Button variant="ghost" onClick={()=>onFollowUp?.(sample)}><RefreshCcw size={14}/>','<Button className="sample-followup-action" variant="secondary" onClick={()=>onFollowUp?.(sample)}><RefreshCcw size={14}/>',1)
          for key in ['assessment','sample','hai','amr','therapy','isolation','reassessment']:
            old=f'<Button variant="secondary" onClick={{()=>setDialog(\'{key}\')}}>'
            new=f'<Button className="clinical-stage-action" variant="secondary" onClick={{()=>setDialog(\'{key}\')}}>'
            s=s.replace(old,new,1)
          p.write_text(s)
          css=Path('src/styles/canonical-registry-visual.css')
          c=css.read_text()
          c=c.replace('\n/* Independent laboratory sample groups inside Surveillance & Samples. */\n[data-sample-root="true"] { border-top: 3px solid var(--border-strong, #cbd9e6) !important; box-shadow: inset 3px 0 0 var(--accent, #2f80b7); }','')
          block='''
/* Surveillance grouping: one divider before independent samples; follow-ups stay nested. */
.surveillance-independent-samples{border-top:3px solid var(--lo-color-border-strong,#b9ccdc)}
.surveillance-independent-samples>[data-sample-root]:first-child>.surveillance-tree-sample:first-child{border-top:0!important}
.surveillance-tree-sample:not(.is-followup)>span:first-child{padding-left:18px}
.surveillance-sample-actions{display:flex;gap:8px;align-items:center;justify-content:flex-start;overflow:visible;min-width:286px}
.surveillance-sample-actions>em{min-width:72px;text-align:center}
.surveillance-sample-actions .btn{white-space:nowrap}
.sample-followup-action{min-width:118px;justify-content:center}
.sample-start-action{min-width:145px;justify-content:center}
.clinical-stage-action{font-weight:700!important;border-color:var(--lo-color-primary,#2176a9)!important;color:var(--lo-color-primary,#17658f)!important;background:var(--lo-color-primary-soft,#eef7fc)!important;box-shadow:0 1px 2px rgba(15,56,82,.08)}
.clinical-stage-action:hover{background:var(--lo-color-primary-soft-hover,#e2f2fa)!important}
'''
          if 'Surveillance grouping: one divider' not in c: c+=block
          css.write_text(c)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/canonical-registry-visual.css
          git diff --cached --check
          git commit -m "Refine surveillance grouping and action alignment"
          git push origin HEAD:fix/surveillance-group-layout-actions