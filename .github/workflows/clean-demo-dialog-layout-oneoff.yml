name: Clean demo dialog layout one off
on:
  push:
    paths:
      - .github/workflows/clean-demo-dialog-layout-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/clean-demo-dialog-layout.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/styles/design-system-layouts.css
          git commit -m "fix(owner): consolidate demo dialog layout" || exit 0
          git push
