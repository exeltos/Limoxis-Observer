name: Patch surveillance clinical records
on:
  push:
    branches: [feat/surveillance-clinical-records]
    paths: [.github/workflows/patch-surveillance-clinical-records.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surveillance-clinical-records
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply clinical record refinement
        run: |
          python scripts/patch_surveillance_clinical_records.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'function escapeReport\(value\)\{.*?\}\nfunction printSurveillanceReport', '''function escapeReport(value){return String(value??'—').replace(/[&<>\"]/g,ch=>ch==='&'?'&amp;':ch==='<'?'&lt;':ch==='>'?'&gt;':'&quot;')}\nfunction printSurveillanceReport''',s,count=1,flags=re.S)
          s=s.replace('<script>window.onload=()=>window.print()<\\/script>','')
          s=s.replace("FEVER:language==='el'?'Πυρετός':'Fever',CHILLS:language==='el'?'Ρίγος':'Chills',ICU_STAY:language==='el'?'Νοσηλεία σε ΜΕΘ':'ICU stay',undetermined:language==='el'?'Δεν έχει ακόμη ταξινομηθεί':'Not yet classified',created:language==='el'?'Δημιουργία επιτήρησης':'Surveillance created',no:language==='el'?'Όχι':'No',","FEVER:language==='el'?'Πυρετός':'Fever',CHILLS:language==='el'?'Ρίγος':'Chills',ICU_STAY:language==='el'?'Νοσηλεία σε ΜΕΘ':'ICU stay',")
          old="w.document.write(html);w.document.close()}"
          if old in s:s=s.replace(old,"w.document.write(html);w.document.close();setTimeout(()=>w.print(),80)}",1)
          p.write_text(s,encoding='utf-8')
          PY
          sed -i 's/[[:space:]]\+$//' src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
      - name: Validate
        run: |
          npm ci
          npm run audit:frontend-parity
          npm run audit:observer-ui
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-surveillance-clinical-records.yml scripts/patch_surveillance_clinical_records.py
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
          git diff --cached --check
          git commit -m "Refine surveillance clinical records and PDF report"
          git push origin HEAD:feat/surveillance-clinical-records
