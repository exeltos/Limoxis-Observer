name: Refine patient clinical tabs
on:
  push:
    branches:
      - fix/patient-clinical-tabs
    paths:
      - .github/workflows/patch-patient-clinical-tabs.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-clinical-tabs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply refinement
        run: |
          python scripts/patch_patient_clinical_tabs.py
          sed -i 's/[[:space:]]\+$//' src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-patient-clinical-tabs.yml scripts/patch_patient_clinical_tabs.py
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
          git diff --cached --check
          git commit -m "Refine patient clinical data and history tabs"
          git push origin HEAD:fix/patient-clinical-tabs