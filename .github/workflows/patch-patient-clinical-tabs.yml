name: Refine patient clinical tabs
on:
  push:
    branches: [fix/patient-clinical-tabs]
    paths: [.github/workflows/patch-patient-clinical-tabs.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-clinical-tabs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine clinical data, documents and history
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          s=p.read_text()
          s=s.replace("<ClinicalSnapshot record={record} t={t} fmtDate={fmtDate}/>","<ClinicalSnapshot record={record} t={t} language={language} fmtDate={fmtDate}/>",1)
          s=s.replace("<Timeline record={record} t={t} fmtDateTime={fmtDateTime}/>","<Timeline record={record} t={t} language={language} fmtDateTime={fmtDateTime}/>",1)
          start=s.index('function ClinicalSnapshot(')
          end=s.index('\nfunction CompletedReport',start)
          replacement=r'''function ClinicalSnapshot({record,t,language,fmtDate}){const latest=record?.samples?.find(x=>x.organism)||record?.samples?.[0];const assessment=record?.assessment;const therapy=record?.therapy||[];const reassessments=record?.reassessments||[];const lastReview=reassessments[reassessments.length-1];return <div className="clinical-data-workspace"><section className="record-section clinical-data-overview"><div className="record-section-header"><div><h3>{language==='el'?'Κλινικά δεδομένα επιτήρησης':'Surveillance clinical data'}</h3><p>{language==='el'?'Συγκεντρωτική εικόνα της επιλεγμένης επιτήρησης. Οι καταχωρήσεις γίνονται από τη ροή Επιτήρηση & Δείγματα.':'Consolidated view of the selected surveillance episode. Entries are recorded from Surveillance & Samples.'}</p></div></div><div className="clinical-data-cards"><ClinicalDataCard icon={ShieldCheck} title={language==='el'?'Κλινική αξιολόγηση':'Clinical assessment'} state={assessment?(language==='el'?'Τεκμηριωμένη':'Documented'):(language==='el'?'Δεν έχει τεκμηριωθεί':'Not documented')}><ClinicalDatum label={language==='el'?'Ταξινόμηση':'Classification'} value={assessment?.classification?t(assessment.classification):'—'}/><ClinicalDatum label={language==='el'?'Σύνοψη':'Summary'} value={assessment?.summary||'—'}/><TagList title={language==='el'?'Σημεία / συμπτώματα':'Signs / symptoms'} items={assessment?.signsSymptoms||assessment?.symptoms||[]}/></ClinicalDataCard><ClinicalDataCard icon={Microscope} title={language==='el'?'Μικροβιολογία':'Microbiology'} state={record?.samples?.length?`${record.samples.length} ${language==='el'?'δείγμα(τα)':'sample(s)'}`:(language==='el'?'Χωρίς δείγματα':'No samples')}><ClinicalDatum label={language==='el'?'Τελευταίο εύρημα':'Latest finding'} value={latest?.organism||t(latest?.result||'pending')}/><ClinicalDatum label="AMR" value={latest?.resistance||record?.resistance||'—'}/></ClinicalDataCard><ClinicalDataCard icon={Pill} title={language==='el'?'Αντιμικροβιακή αγωγή':'Antimicrobial therapy'} state={therapy.length?`${therapy.length} ${language==='el'?'αγωγή(ές)':'therapy item(s)'}`:(language==='el'?'Δεν καταγράφηκε':'Not recorded')}><ClinicalDatum label={language==='el'?'Τρέχουσα αγωγή':'Current therapy'} value={therapy.map(x=>x.antimicrobial).filter(Boolean).join(', ')||'—'}/></ClinicalDataCard><ClinicalDataCard icon={RefreshCcw} title={language==='el'?'Επανεκτίμηση':'Reassessment'} state={record?.reviewDue?`${language==='el'?'Επόμενη':'Next'}: ${fmtDate(record.reviewDue)}`:'—'}><ClinicalDatum label={language==='el'?'Τελευταία κατάσταση':'Latest status'} value={lastReview?.status?t(lastReview.status):'—'}/><ClinicalDatum label={language==='el'?'Επόμενη επανεκτίμηση':'Next review'} value={fmtDate(record?.reviewDue)}/></ClinicalDataCard></div></section></div>}
function ClinicalDataCard({icon:Icon,title,state,children}){return <article className="clinical-data-card"><header><span className="clinical-data-icon"><Icon size={17}/></span><div><h4>{title}</h4><small>{state}</small></div></header><div className="clinical-data-card-body">{children}</div></article>}
function ClinicalDatum({label,value}){return <div className="clinical-datum"><span>{label}</span><strong>{value||'—'}</strong></div>}
function timelineLabel(type,language,t){const labels={created:['Δημιουργία επιτήρησης','Surveillance created'],surveillance_start:['Έναρξη επιτήρησης','Surveillance started'],clinical_assessment:['Κλινική αξιολόγηση','Clinical assessment'],sample_requested:['Αίτημα δείγματος','Sample requested'],sample_collected:['Λήψη δείγματος','Sample collected'],sample_result:['Αποτέλεσμα δείγματος','Sample result'],isolation_started:['Έναρξη απομόνωσης','Isolation started'],isolation_not_required:['Δεν απαιτείται απομόνωση','Isolation not required'],therapy_started:['Έναρξη αντιμικροβιακής αγωγής','Antimicrobial therapy started'],reassessment:['Επανεκτίμηση','Reassessment'],outcome:['Έκβαση','Outcome'],surveillance_closed:['Ολοκλήρωση επιτήρησης','Surveillance closed']};return labels[type]?.[language==='el'?0:1]||t(type)||String(type||'—').replaceAll('_',' ')}
function Timeline({record,t,language,fmtDateTime}){const rows=[...(record?.timeline||[])].sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));return <section className="record-section patient-history-section"><div className="record-section-header"><div><h3>{language==='el'?'Ιστορικό επιτήρησης':'Surveillance history'}</h3><p>{language==='el'?'Χρονολογικό audit trail των κλινικών ενεργειών της επιλεγμένης επιτήρησης.':'Chronological audit trail for the selected surveillance episode.'}</p></div></div>{rows.length?<div className="patient-history-list">{rows.map((x,i)=><article className="patient-history-event" key={`${x.at||'event'}-${i}`}><div className="history-rail"><span></span></div><div className="history-event-main"><div className="history-event-heading"><strong>{timelineLabel(x.type,language,t)}</strong><time>{fmtDateTime(x.at)}</time></div>{x.detail&&<p>{x.detail}</p>}<div className="history-event-meta">{(x.actor||x.actorId)&&<span>{language==='el'?'Χρήστης':'User'}: {x.actor||x.actorId}</span>}{x.sampleId&&<span>{language==='el'?'Δείγμα':'Sample'}: {x.sampleId}</span>}</div></div></article>)}</div>:<div className="inline-empty">{language==='el'?'Δεν υπάρχουν ακόμη καταγεγραμμένες ενέργειες.':'No recorded events yet.'}</div>}</section>}
'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          css=Path('src/styles/patient-record.css');c=css.read_text();rules=r'''

/* Patient clinical data + history refinement */
.clinical-data-workspace,.patient-history-section{height:100%;min-height:0}
.clinical-data-overview{height:auto!important;overflow:visible!important}
.clinical-data-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 14px 16px}
.clinical-data-card{border:1px solid #dbe6ee;border-radius:10px;background:#fff;overflow:hidden;min-height:150px}
.clinical-data-card>header{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #edf2f5;background:#fbfdfe}
.clinical-data-card h4{margin:0;color:#173a55;font-size:13px}.clinical-data-card small{display:block;margin-top:2px;color:#718798;font-size:10.5px}
.clinical-data-icon{width:30px;height:30px;border-radius:8px;background:#eaf4fa;color:#216e9d;display:grid;place-items:center;flex:none}
.clinical-data-card-body{padding:10px 12px}.clinical-datum{display:grid;grid-template-columns:145px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid #f0f3f5}.clinical-datum:last-child{border-bottom:0}.clinical-datum span{color:#718697;font-size:11px}.clinical-datum strong{color:#1b405a;font-size:11.5px;font-weight:650}
.patient-history-section{overflow:hidden!important}.patient-history-list{height:calc(100% - 70px);min-height:300px;overflow:auto;padding:8px 18px 18px}.patient-history-event{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;position:relative}.history-rail{position:relative;display:flex;justify-content:center}.history-rail:after{content:"";position:absolute;top:17px;bottom:-8px;width:1px;background:#d9e5ed}.patient-history-event:last-child .history-rail:after{display:none}.history-rail span{width:9px;height:9px;border:2px solid #4a91bc;background:#fff;border-radius:50%;margin-top:14px;z-index:1}.history-event-main{padding:9px 10px 11px;border-bottom:1px solid #edf2f5;min-width:0}.history-event-heading{display:flex;align-items:baseline;justify-content:space-between;gap:15px}.history-event-heading strong{color:#173b55;font-size:12px}.history-event-heading time{color:#718697;font-size:10.5px;white-space:nowrap}.history-event-main p{margin:5px 0 0;color:#49677a;font-size:11px;line-height:1.45;overflow-wrap:anywhere}.history-event-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;color:#8295a3;font-size:10px}
@media(max-width:850px){.clinical-data-cards{grid-template-columns:1fr}.clinical-datum{grid-template-columns:120px minmax(0,1fr)}}
'''
          if '/* Patient clinical data + history refinement */' not in c:css.write_text(c+rules)
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-patient-clinical-tabs.yml
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
          git diff --cached --check
          git commit -m "Refine patient clinical data and history tabs"
          git push origin HEAD:fix/patient-clinical-tabs