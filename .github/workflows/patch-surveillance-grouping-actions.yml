name: Patch surveillance grouping and actions

on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-surveillance-grouping-actions.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-grouping-action-buttons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx');s=p.read_text()
          for a,b in {
            "language==='el'?'Νέα αγωγή':'New therapy'":"language==='el'?'Νέα αντιμικροβιακή αγωγή':'New antimicrobial therapy'",
            "language==='el'?'Νέα απομόνωση':'New isolation'":"language==='el'?'Νέα καταχώρηση απομόνωσης':'New isolation record'",
          }.items(): s=s.replace(a,b)
          if 'data-sample-root' not in s:
            start=s.index('function SampleTree(')
            end=s.find('\nfunction ',start+20)
            if end<0:end=len(s)
            part=s[start:end]
            if '<tr' not in part: raise SystemExit('SampleTree tr marker not found')
            part=part.replace('<tr',"<tr data-sample-root={depth===0?'true':undefined}",1)
            s=s[:start]+part+s[end:]
          p.write_text(s)
          css=Path('src/styles/surveillance-dropdown-fix.css');c=css.read_text();block='''\n/* Independent laboratory sample groups inside Surveillance & Samples. */\ntr[data-sample-root="true"] > td { border-top: 3px solid var(--border-strong, #cbd9e6) !important; }\ntr[data-sample-root="true"] > td:first-child { box-shadow: inset 3px 0 0 var(--accent, #2f80b7); }\n'''
          if 'Independent laboratory sample groups' not in c: css.write_text(c+block)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/surveillance-dropdown-fix.css
          git diff --cached --check
          git commit -m "Group independent surveillance samples and refine actions"
          git push origin HEAD:fix/surveillance-grouping-action-buttons
