name: Patch root sample alignment
on:
  push:
    branches: [fix/surveillance-root-sample-alignment]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-root-sample-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Patch UI
        run: python3 scripts/patch_root_sample_alignment.py
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/canonical-registry-visual.css
          git diff --cached --check
          git commit -m "Align independent samples and follow-up actions"
          git push origin HEAD:fix/surveillance-root-sample-alignment
