name: Fix owner organization lint one off

on:
  push:
    paths:
      - .github/workflows/fix-owner-organization-lint-oneoff.yml
      - scripts/fix-owner-organization-lint.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-owner-organization-lint.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/workspaces/PlatformCenterPage.jsx
          git commit -m "fix(owner): clear organization workspace lint" || exit 0
          git push
