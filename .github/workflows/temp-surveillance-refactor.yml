name: Temporary surveillance refactor
on:
  push:
    branches:
      - refactor/surveillance-guided-flow
permissions:
  contents: write
jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[surveillance-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/surveillance-guided-flow
      - name: Patch surveillance workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing pattern: {label}')
              return text.replace(old, new, 1)

          path = Path('src/features/surveillance/NewSurveillanceFlow.jsx')
          text = path.read_text()
          text = replace_once(text,
              "import { Activity, AlertTriangle, BedDouble, CheckCircle2, CircleCheckBig, FlaskConical, Microscope, Pill, Plus, RefreshCcw, ShieldCheck, X } from 'lucide-react'",
              "import { Activity, AlertTriangle, BedDouble, CheckCircle2, FlaskConical, Microscope, Plus, ShieldCheck, X } from 'lucide-react'",
              'new flow icons')
          text, n = re.subn(r"const stepDefs=\[.*?\n\]\n\nconst screeningQuestions=", """const stepDefs=[
            {id:'start',label:'surveillanceStart',icon:Activity},
            {id:'assessment',label:'clinicalAssessment',icon:ShieldCheck},
            {id:'microbiology',label:'sampleAndLaboratory',icon:Microscope},
            {id:'isolation',label:'isolation',icon:BedDouble},
          ]

          const screeningQuestions=""", text, count=1, flags=re.S)
          if n != 1: raise SystemExit('missing pattern: step defs')
          text, n = re.subn(r"  const completed=useMemo\(\(\)=>\{.*?\n  \},\[record,linkedLabSamples\]\)", """  const completed=useMemo(()=>{
            const c=new Set()
            if(record)c.add('start')
            if(record?.assessment)c.add('assessment')
            if(linkedLabSamples.length)c.add('microbiology')
            if(record?.isolation||record?.isolationDecision?.required===false)c.add('isolation')
            return c
          },[record,linkedLabSamples])""", text, count=1, flags=re.S)
          if n != 1: raise SystemExit('missing pattern: completed')
          text, n = re.subn(r"  function allowed\(step\)\{.*?\n  \}", """  function allowed(step){
            if(step==='start')return true
            if(step==='assessment')return Boolean(record)
            if(step==='microbiology')return Boolean(record?.assessment)
            if(step==='isolation')return Boolean(record?.assessment)
            return false
          }""", text, count=1, flags=re.S)
          if n != 1: raise SystemExit('missing pattern: allowed')
          text = text.replace("<span>05</span><h3>{t('isolation')}</h3>", "<span>04</span><h3>{t('isolation')}</h3>")
          for line in [
              "        {activeStep==='hai'&&<LockedDetail title={t('haiAmr')} text={t('clinicalRecords.haiStepReady')} />}\n",
              "        {activeStep==='therapy'&&<LockedDetail title={t('therapy')} text={t('clinicalRecords.therapyStepReady')} />}\n",
              "        {activeStep==='reassessment'&&<LockedDetail title={t('reassessment')} text={t('clinicalRecords.reassessmentStepReady')} />}\n",
              "        {activeStep==='outcome'&&<LockedDetail title={t('outcome')} text={t('clinicalRecords.outcomeStepReady')} />}\n",
          ]:
              text = text.replace(line, '')
          text = re.sub(r"\nfunction LockedDetail\(\{title,text\}\)\{return <section className=\"flow-step-panel\">.*?\}\n?$", "\n", text, count=1, flags=re.S)
          path.write_text(text)

          path = Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          text = path.read_text()
          text = replace_once(text,
              "import { Activity,AlertTriangle,BedDouble,FileClock,FolderOpen,ListTree,Microscope,Pill,PlayCircle,RefreshCcw,ShieldCheck,UserRound,X } from 'lucide-react'",
              "import { Activity,AlertTriangle,BedDouble,Download,FileClock,FolderOpen,ListTree,Microscope,Pill,PlayCircle,Printer,RefreshCcw,ShieldCheck,Trash2,UserRound,X } from 'lucide-react'",
              'episode icons')
          text = replace_once(text,
              "import { Button } from '../../design-system/Button'\n",
              "import { Button } from '../../design-system/Button'\nimport { OverflowMenu } from '../../design-system/OverflowMenu'\n",
              'overflow import')
          old = """function SurveillanceWorkspace({samples=[],episodes,selectedId,onSelect,onCreate,onCreateFromSample,onCreateSample,canCreate,canCreateSample,repository,onReload,t,language,fmtDate,fmtDateTime,permissions}){
            const [sampleOpen,setSampleOpen]=useState(false),[samplePrompt,setSamplePrompt]=useState(null),[detailId,setDetailId]=useState('')
            const detailRecord=episodes.find(ep=>String(ep.id)===String(detailId))||null""".replace('            ','  ')
          new = """function SurveillanceWorkspace({samples=[],episodes,selectedId,onSelect,onCreate,onCreateFromSample,onCreateSample,canCreate,canCreateSample,repository,onReload,t,language,fmtDate,fmtDateTime,permissions}){
            const {notify}=useFeedback()
            const [sampleOpen,setSampleOpen]=useState(false),[samplePrompt,setSamplePrompt]=useState(null),[detailId,setDetailId]=useState('')
            const [deleteOpen,setDeleteOpen]=useState(false),[deleteReason,setDeleteReason]=useState('')
            const detailRecord=episodes.find(ep=>String(ep.id)===String(detailId))||null""".replace('            ','  ')
          text = replace_once(text, old, new, 'workspace state')
          pattern = r"  function openEpisode\(id\)\{onSelect\?\.\(id\);setDetailId\(id\)\}\n  if\(detailRecord\)return <div className=\"episode-overlay new-surveillance-flow-overlay\" role=\"dialog\" aria-modal=\"true\">.*?\n  </div>\n  return <div className=\"workspace-column workspace-fill patient-surveillance-clean\">"
          replacement = """  function openEpisode(id){onSelect?.(id);setDetailId(id)}
          async function removeEpisode(){
            if(!detailRecord||!deleteReason.trim())return
            try{
              await repository.voidCase(detailRecord,deleteReason.trim())
              setDeleteOpen(false);setDeleteReason('');setDetailId('')
              await onReload()
              notify(t('clinicalRecords.surveillanceDeleted'),'success')
            }catch(error){notify(error?.message||t('actionFailed'),'danger')}
          }
          if(detailRecord)return <div className="episode-overlay new-surveillance-flow-overlay" role="dialog" aria-modal="true">
            <section className="episode-detail-card new-surveillance-flow-card">
              <header className="episode-detail-header">
                <div><span className="eyebrow">{t('surveillance')}</span><h2>{language==='el'?'Επεισόδιο επιτήρησης':'Surveillance episode'}</h2><p>{fmtDate(detailRecord.startedAt)} · {language==='el'?'Κλινική παρακολούθηση':'Clinical follow-up'}</p></div>
                <div className="episode-detail-actions">
                  <span className={`status-badge ${detailRecord.status==='active'?'active':''}`}>{t(detailRecord.status)}</span>
                  <OverflowMenu label={language==='el'?'Ενέργειες επιτήρησης':'Surveillance actions'} items={[
                    {id:'print',label:language==='el'?'Εκτύπωση':'Print',icon:Printer,onClick:()=>window.print()},
                    {id:'download',label:language==='el'?'Λήψη δεδομένων':'Download data',icon:Download,onClick:()=>downloadRecordJson(detailRecord,{filename:`surveillance-${detailRecord.id}`})},
                    permissions.canDelete?{id:'delete',label:language==='el'?'Διαγραφή επιτήρησης':'Delete surveillance',icon:Trash2,tone:'danger',separatorBefore:true,onClick:()=>{setDeleteReason('');setDeleteOpen(true)}}:null,
                  ].filter(Boolean)}/>
                  <button className="episode-close" title={t('close')} onClick={()=>setDetailId('')}><X size={16}/></button>
                </div>
              </header>
              <div className="episode-detail-scroll progressive-surveillance-scroll">
                <CanonicalJourney record={detailRecord} repository={repository} onReload={()=>onReload(detailRecord.id)} t={t} fmtDate={fmtDate} fmtDateTime={fmtDateTime} permissions={permissions}/>
              </div>
            </section>
            {deleteOpen&&<ReasonDialog title={language==='el'?'Διαγραφή επιτήρησης':'Delete surveillance'} t={t} reason={deleteReason} setReason={setDeleteReason} onClose={()=>{setDeleteOpen(false);setDeleteReason('')}} onSave={removeEpisode}/>} 
          </div>
          return <div className="workspace-column workspace-fill patient-surveillance-clean">"""
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('missing pattern: episode overlay')
          old_heading = "return <div className=\"clinical-data-hub\"><div className=\"journey-heading\"><div><span className=\"eyebrow\">{t('surveillanceJourney')}</span><h3>{record.id}</h3><p>{t('clinicalRecords.strictActiveJourneyHelp')}</p></div>{permissions.canDelete&&<Button variant=\"danger\" onClick={()=>setDialog('void')}>{t('delete')}</Button>}</div>"
          new_heading = "return <div className=\"clinical-data-hub\"><div className=\"journey-heading episode-journey-heading\"><div><span className=\"eyebrow\">{t('surveillanceJourney')}</span><h3 className=\"journey-case-id\">{record.id}</h3><p>{t('clinicalRecords.strictActiveJourneyHelp')}</p></div></div>"
          text = replace_once(text, old_heading, new_heading, 'journey heading')
          text = text.replace("{record.assessment?t('edit'):t('add')}", "{record.assessment?t('edit'):`+ ${t('clinicalAssessment')}`}", 1)
          text = re.sub(r"\n  \{dialog==='void'&&<ReasonDialog.*?/\>} ", "", text, count=1)
          path.write_text(text)

          path = Path('src/styles/patient-record.css')
          css = path.read_text()
          marker = '/* Guided surveillance episode refinement. */'
          if marker not in css:
              css += """

          /* Guided surveillance episode refinement. */
          .episode-detail-card .episode-detail-header{min-height:72px!important;padding:14px 18px!important;border-bottom:1px solid #e4eaf0!important;background:#fff!important}
          .episode-detail-card .episode-detail-header .eyebrow{color:#8291a1!important;font-size:9.5px!important;font-weight:800!important;letter-spacing:.06em!important}
          .episode-detail-card .episode-detail-header h2{margin:2px 0 0!important;font-size:18px!important;color:#17334c!important}
          .episode-detail-card .episode-detail-header p{margin:3px 0 0!important;color:#7a8a9a!important;font-size:10.5px!important}
          .episode-detail-actions{display:flex!important;align-items:center!important;gap:8px!important}
          .episode-detail-actions .episode-close{width:34px!important;height:34px!important;border:1px solid #dbe4eb!important;border-radius:9px!important;background:#fff!important;color:#50677d!important;display:grid!important;place-items:center!important}
          .episode-detail-card .clinical-data-hub{padding:14px 16px 18px!important;gap:10px!important}
          .episode-detail-card .episode-journey-heading{margin:0!important;padding:0 0 8px!important;border-bottom:1px solid #edf1f4!important}
          .episode-detail-card .journey-guidance{margin:0!important;padding:7px 9px!important;border-radius:9px!important}
          .episode-detail-card .journey-guidance-items{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))!important}
          .episode-detail-card .guidance-cue{min-height:44px!important;padding:7px 9px!important}
          .episode-detail-card .journey-map{margin:0!important;padding:10px!important;border:1px solid #e5ebf0!important;border-radius:11px!important;background:#fbfcfd!important}
          .episode-detail-card .clinical-data-grid>.clinical-panel{padding:12px 14px!important}
          .episode-detail-card .clinical-data-grid>.clinical-panel>.record-section-header{align-items:center!important;margin-bottom:8px!important}
          .episode-detail-card .clinical-data-grid>.clinical-panel>.record-section-header .btn{min-height:32px!important;padding:5px 10px!important;font-size:10px!important}
          .new-surveillance-flow-card .progressive-journey-header{margin:0 0 8px!important}
          .new-surveillance-flow-card .progressive-journey-rail{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important;margin:0 0 10px!important}
          .new-surveillance-flow-card .progressive-step{min-height:62px!important;padding:9px 10px!important;border:1px solid #e1e8ee!important;border-radius:10px!important;background:#fff!important;text-align:left!important}
          .new-surveillance-flow-card .progressive-step.current{border-color:#73b8d7!important;background:#eef8fc!important;box-shadow:inset 0 0 0 1px #c7e4f1!important}
          .new-surveillance-flow-card .progressive-step.complete{background:#f3faf6!important;border-color:#d2e9db!important}
          .new-surveillance-flow-card .progressive-step.locked{opacity:.55!important;background:#fafbfc!important}
          .new-surveillance-flow-card .progressive-step>i{display:none!important}
          .new-surveillance-flow-card .progressive-guidance{margin:0 0 10px!important;padding:8px 10px!important;border-radius:9px!important}
          .new-surveillance-flow-card .flow-step-panel{border:1px solid #e1e8ee!important;border-radius:11px!important;background:#fff!important;padding:14px!important}
          @media(max-width:900px){.new-surveillance-flow-card .progressive-journey-rail{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
          """
          path.write_text(css)
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/NewSurveillanceFlow.jsx src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
          git commit -m "Refine guided surveillance workflow"
          git push origin HEAD:refactor/surveillance-guided-flow
