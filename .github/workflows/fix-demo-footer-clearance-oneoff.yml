name: Fix demo footer clearance one off
on:
  push:
    paths:
      - .github/workflows/fix-demo-footer-clearance-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-demo-footer-clearance.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/styles/design-system-layouts.css
          git commit -m "fix(owner): keep demo footer clear of lower fields" || exit 0
          git push
