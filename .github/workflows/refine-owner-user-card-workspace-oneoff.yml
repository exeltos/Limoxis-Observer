name: Refine owner user card workspace one off
on:
  push:
    paths:
      - .github/workflows/refine-owner-user-card-workspace-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/refine-owner-user-card-workspace.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/platform/PlatformOrganizationRecord.jsx src/styles/design-system-layouts.css
          git commit -m "fix(owner): render expanded user as true management card" || exit 0
          git push
