name: Lock owner details and location autocomplete one off

on:
  push:
    paths:
      - .github/workflows/lock-owner-details-and-location-autocomplete-oneoff.yml
      - scripts/lock-owner-details-and-location-autocomplete.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/lock-owner-details-and-location-autocomplete.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/workspaces/PlatformCenterPage.jsx src/features/platform/PlatformOrganizationRecord.jsx src/features/platform/PlatformDemoRecord.jsx src/styles/design-system-layouts.css
          git commit -m "fix(owner): lock details and improve location/contact fields" || exit 0
          git push
