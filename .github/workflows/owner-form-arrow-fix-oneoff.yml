name: Owner form and analysis back fix one-off

on:
  push:
    paths:
      - .github/workflows/owner-form-arrow-fix-oneoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch requested UI
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/features/workspaces/PlatformCenterPage.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  country: 'Greece',", "  country: '',")
          s=s.replace("    country: 'Greece',", "    country: '',")
          s=s.replace("country:'Greece'", "country:''")
          s=s.replace("country: org.country || 'Greece'", "country: org.country || ''")
          p.write_text(s,encoding='utf-8')

          p=Path('src/core/tenant/tenantService.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("country = 'Greece'", "country = ''")
          s=s.replace("country: country || 'Greece'", "country: country || null")
          s=s.replace("country: patch.country || 'Greece'", "country: patch.country || null")
          p.write_text(s,encoding='utf-8')

          p=Path('src/features/analysis/AnalysisPage.jsx')
          s=p.read_text(encoding='utf-8')
          old="{returnTo&&<BackButton onClick={()=>navigate(returnTo)} label={tx('Πίσω','Back')}/>}"
          new="{returnTo&&!platform&&<BackButton onClick={()=>navigate(returnTo)} label={tx('Πίσω','Back')}/>}"
          if old not in s:
              raise SystemExit('Expected analysis back button source not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          wf=Path('.github/workflows/owner-form-arrow-fix-oneoff.yml')
          wf.unlink()
      - name: Commit patch
        run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/workspaces/PlatformCenterPage.jsx src/core/tenant/tenantService.js src/features/analysis/AnalysisPage.jsx .github/workflows/owner-form-arrow-fix-oneoff.yml
          git commit -m "fix(owner-ui): clear country defaults and remove platform analysis back"
          git push origin main
