name: Fix owner pencil lock one off
on:
  push:
    paths:
      - .github/workflows/fix-owner-pencil-lock-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-owner-pencil-lock.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/platform/PlatformOrganizationRecord.jsx src/features/platform/PlatformDemoRecord.jsx src/styles/design-system-layouts.css
          git commit -m "fix(owner): keep edit pencil active while fields are locked" || exit 0
          git push
