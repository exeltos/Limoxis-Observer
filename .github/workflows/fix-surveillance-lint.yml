name: Fix surveillance lint
on:
  push:
    branches: [fix/surveillance-visible-polish]
    paths: [.github/workflows/fix-surveillance-lint.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-visible-polish
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          s=p.read_text().replace('function TagList({title,items=[],t,language})','function TagList({title,items=[],t:_t,language})')
          p.write_text(s)
          Path('.github/workflows/fix-surveillance-lint.yml').unlink()
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix surveillance terminology lint"
          git push origin HEAD:fix/surveillance-visible-polish
