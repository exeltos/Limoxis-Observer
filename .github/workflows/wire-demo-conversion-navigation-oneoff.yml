name: Wire demo conversion navigation one off

on:
  push:
    paths:
      - .github/workflows/wire-demo-conversion-navigation-oneoff.yml
      - scripts/wire-demo-conversion-navigation.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/wire-demo-conversion-navigation.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/workspaces/PlatformCenterPage.jsx
          git commit -m "fix(owner): complete demo to organization transition" || exit 0
          git push
