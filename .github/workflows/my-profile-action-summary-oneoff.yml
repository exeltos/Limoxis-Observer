name: My profile action summary one off

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/my-profile-action-summary-oneoff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply profile summary refinement
        run: node tools/patch-my-profile-action-summary.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/employees/EmployeeRecordPage.jsx src/styles/my-profile.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "refactor(profile): make self profile action oriented"
            git push origin main
          fi
