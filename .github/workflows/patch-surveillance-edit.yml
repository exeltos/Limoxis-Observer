name: Patch surveillance edit workflow

on:
  push:
    branches:
      - feat/patient-surveillance-workflow-preview
    paths:
      - .github/workflows/patch-surveillance-edit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/patient-surveillance-workflow-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch surveillance editing and cleanup flow
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing patch anchor: {label}')
              return text.replace(old, new, 1)

          # 1) Cloud service: persist edits to the episode start data while preserving audit history.
          path = Path('src/features/surveillance/clinicalCloudService.js')
          text = path.read_text()
          text = replace_once(text,
              "    reasonEn:start.reasonEn||start.reason||'',\n    status:caseRow.status,",
              "    reasonEn:start.reasonEn||start.reason||'',\n    suspectedSource:start.suspectedSource||'',\n    status:caseRow.status,",
              'map suspected source')
          marker = 'export async function deleteClinicalCaseForTesting(organizationId, caseRecordId){'
          fn = '''export async function updateClinicalCaseBasics(organizationId,record,draft){\n  assertCloud()\n  const actorId=await currentUserId()\n  const startedAt=iso(draft.startedAt||record.startedAt||new Date())\n  const {data:caseRow,error}=await supabase.from('surveillance_cases').update({started_at:startedAt,department_id:draft.departmentId||record.departmentId||null}).eq('organization_id',organizationId).eq('id',record.recordId).select('*').single()\n  if(error)throw error\n  const payload={\n    reviewDue:draft.reviewDue??record.reviewDue??null,\n    room:draft.room??record.room??'',\n    reason:draft.reason??record.reason??'',\n    reasonEn:draft.reasonEn??draft.reason??record.reasonEn??record.reason??'',\n    suspectedSource:draft.suspectedSource??record.suspectedSource??'',\n    detail:'updated',\n  }\n  const {error:eventError}=await supabase.from('surveillance_events').insert({organization_id:organizationId,surveillance_case_id:record.recordId,event_type:'surveillance_start',event_status:'completed',occurred_at:startedAt,payload,created_by:actorId})\n  if(eventError)throw eventError\n  return (await hydrateCases([caseRow]))[0]\n}\n\n'''
          text = replace_once(text, marker, fn + marker, 'updateClinicalCaseBasics')
          path.write_text(text)

          # 2) Repository: expose the edit operation in cloud/demo modes.
          path = Path('src/features/surveillance/clinicalRepository.js')
          text = path.read_text()
          text = replace_once(text,
              '  startIsolation,\n  voidClinicalCase,',
              '  startIsolation,\n  updateClinicalCaseBasics,\n  voidClinicalCase,',
              'repository import')
          marker = '  async function saveAssessment(record,draft){'
          fn = '''  async function updateCase(record,draft){\n    if(!isDemo)return updateClinicalCaseBasics(organizationId,record,draft)\n    const target=demoRecord(clinicalCases[record.id])\n    Object.assign(target,{startedAt:draft.startedAt||target.startedAt,reviewDue:draft.reviewDue??target.reviewDue,room:draft.room??target.room,reason:draft.reason??target.reason,reasonEn:draft.reasonEn??draft.reason??target.reasonEn,suspectedSource:draft.suspectedSource??target.suspectedSource})\n    return touch(target,actor,'surveillanceUpdated',draft.reason||target.reason)\n  }\n'''
          text = replace_once(text, marker, fn + marker, 'repository updateCase')
          text = replace_once(text,
              'return {loadForPatient,loadCase,createCase,saveAssessment,',
              'return {loadForPatient,loadCase,createCase,updateCase,saveAssessment,',
              'repository return updateCase')
          path.write_text(text)

          # 3) Patient page: hide voided test rows, enable edit action, keep delete as audited void.
          path = Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          text = path.read_text()
          text = replace_once(text,
              "  const admissionEpisodes=useMemo(()=>{\n    if(!patientMode||!selectedAdmission)return episodes\n    return episodes.filter(ep=>{",
              "  const admissionEpisodes=useMemo(()=>{\n    const visible=episodes.filter(ep=>ep.status!=='cancelled')\n    if(!patientMode||!selectedAdmission)return visible\n    return visible.filter(ep=>{",
              'hide cancelled episodes')
          text = replace_once(text,
              'canOutcome:has(CAPABILITIES.RECORD_SURVEILLANCE_OUTCOME)||has(CAPABILITIES.CLOSE_SURVEILLANCE),canDelete:',
              'canOutcome:has(CAPABILITIES.RECORD_SURVEILLANCE_OUTCOME)||has(CAPABILITIES.CLOSE_SURVEILLANCE),canEdit:has(CAPABILITIES.EDIT_SURVEILLANCE),canDelete:',
              'edit permission')

          old_state = "const [deleteOpen,setDeleteOpen]=useState(false),[deleteReason,setDeleteReason]=useState('');const detailRecord="
          new_state = "const [deleteOpen,setDeleteOpen]=useState(false),[deleteReason,setDeleteReason]=useState('');const [editOpen,setEditOpen]=useState(false),[editBusy,setEditBusy]=useState(false),[editDraft,setEditDraft]=useState({startedAt:'',reviewDue:'',room:'',reason:'',suspectedSource:''});const detailRecord="
          text = replace_once(text, old_state, new_state, 'edit state')

          anchor = "async function removeEpisode(){if(!detailRecord||!deleteReason.trim())return;"
          insert = "function openEditEpisode(){if(!detailRecord)return;setEditDraft({startedAt:String(detailRecord.startedAt||'').slice(0,10),reviewDue:String(detailRecord.reviewDue||'').slice(0,10),room:detailRecord.room||'',reason:detailRecord.reason||'',suspectedSource:detailRecord.suspectedSource||''});setEditOpen(true)}async function saveEpisodeEdit(){if(!detailRecord||!editDraft.startedAt||!editDraft.reason.trim())return;setEditBusy(true);try{const updated=await repository.updateCase(detailRecord,editDraft);setEditOpen(false);await onReload(updated?.id||detailRecord.id);notify(language==='el'?'Η επιτήρηση ενημερώθηκε.':'Surveillance updated.','success')}catch(error){notify(error?.message||t('actionFailed'),'danger')}finally{setEditBusy(false)}}"
          text = replace_once(text, anchor, insert + anchor, 'edit functions')

          # Add Edit before Print in episode actions.
          text = replace_once(text,
              "items={[{id:'print',label:language==='el'?'Εκτύπωση':'Print',icon:Printer,onClick:()=>window.print()},",
              "items={[permissions.canEdit?{id:'edit',label:language==='el'?'Επεξεργασία επιτήρησης':'Edit surveillance',icon:Activity,onClick:openEditEpisode}:null,{id:'print',label:language==='el'?'Εκτύπωση':'Print',icon:Printer,onClick:()=>window.print()},",
              'edit menu item')
          # Ensure null menu entries are removed (existing delete branch already used filter in earlier builds; normalize whole list close).
          text = text.replace("permissions.canDelete?{id:'delete',label:language==='el'?'Διαγραφή επιτήρησης':'Delete surveillance',icon:Trash2,tone:'danger',separatorBefore:true,onClick:()=>{setDeleteReason('');setDeleteOpen(true)}}:null]}/>", "permissions.canDelete?{id:'delete',label:language==='el'?'Διαγραφή επιτήρησης':'Delete surveillance',icon:Trash2,tone:'danger',separatorBefore:true,onClick:()=>{setDeleteReason('');setDeleteOpen(true)}}:null].filter(Boolean)}/>")

          edit_dialog = '''{editOpen&&<ObserverDialog eyebrow={t('surveillance')} title={language==='el'?'Επεξεργασία επιτήρησης':'Edit surveillance'} subtitle={language==='el'?'Διορθώστε τα αρχικά στοιχεία του επεισοδίου. Οι αλλαγές καταγράφονται στο ιστορικό.':'Update the episode start details. Changes remain auditable.'} width="standard" onClose={()=>!editBusy&&setEditOpen(false)} footer={<div className="dialog-actions"><Button variant="secondary" disabled={editBusy} onClick={()=>setEditOpen(false)}>{t('cancel')}</Button><Button disabled={editBusy||!editDraft.startedAt||!editDraft.reason.trim()} onClick={saveEpisodeEdit}>{editBusy?(language==='el'?'Αποθήκευση…':'Saving…'):t('save')}</Button></div>}><div className="entry-grid compact"><ManualDateField label={language==='el'?'Ημερομηνία έναρξης':'Start date'} value={editDraft.startedAt} onChange={v=>setEditDraft(d=>({...d,startedAt:v}))}/><ManualDateField label={t('nextReview')} optional value={editDraft.reviewDue} onChange={v=>setEditDraft(d=>({...d,reviewDue:v}))}/><label><span>{t('room')}</span><input value={editDraft.room} onChange={e=>setEditDraft(d=>({...d,room:e.target.value}))}/></label><label><span>{t('clinicalRecords.suspectedSource')}</span><select value={editDraft.suspectedSource} onChange={e=>setEditDraft(d=>({...d,suspectedSource:e.target.value}))}><option value="">{t('underAssessment')}</option><option value="bloodstream">{t('clinicalRecords.bloodstream')}</option><option value="urinary">{t('clinicalRecords.urinary')}</option><option value="respiratory">{t('clinicalRecords.respiratory')}</option><option value="surgicalSite">{t('clinicalRecords.surgicalSite')}</option><option value="other">{t('other')}</option></select></label><label className="entry-span-2"><span>{t('surveillanceReason')}</span><textarea rows={3} value={editDraft.reason} onChange={e=>setEditDraft(d=>({...d,reason:e.target.value}))}/></label></div></ObserverDialog>}'''
          if '{deleteOpen&&<ObserverDialog' not in text:
              raise SystemExit('Missing delete dialog anchor')
          text = text.replace('{deleteOpen&&<ObserverDialog', edit_dialog + '{deleteOpen&&<ObserverDialog', 1)
          path.write_text(text)

          print('Surveillance workflow patch applied.')
      - name: Test and build
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commit patched workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/clinicalCloudService.js src/features/surveillance/clinicalRepository.js src/features/surveillance/PatientClinicalCanonicalPage.jsx
          git diff --cached --check
          git commit -m "Complete surveillance edit and cleanup workflow"
          git push origin HEAD:feat/patient-surveillance-workflow-preview
