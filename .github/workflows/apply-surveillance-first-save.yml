name: Apply surveillance first-save refinement
on:
  push:
    branches: [fix/surveillance-flow-first-save-visual]
    paths:
      - scripts/refine_surveillance_first_save.py
      - .github/workflows/apply-surveillance-first-save.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-flow-first-save-visual
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/refine_surveillance_first_save.py
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/NewSurveillanceFlow.jsx
          git diff --cached --quiet || git commit -m "Require explicit first save for surveillance flow"
          git push
