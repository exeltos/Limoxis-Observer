name: Limoxis Observer CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    # `labeled` re-runs the checks when the `visual-change` label is added.
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend parity
        id: parity
        run: npm run audit:frontend-parity

      - name: LIRA regression and safety gate
        id: lira
        run: npm run test:lira

      - name: Full quality gate
        id: quality
        run: npm run check

      - name: Quality summary
        if: always()
        run: |
          echo "## Limoxis Observer quality report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend parity | ${{ steps.parity.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LIRA regression/safety | ${{ steps.lira.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Full npm run check gate | ${{ steps.quality.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The CI gate intentionally executes the same npm run check command used for the full local quality pipeline." >> "$GITHUB_STEP_SUMMARY"

  visual:
    # Compares the computed style of every element on every main screen between
    # the pull request and its base branch (see tools/visual-regression.mjs).
    # Intended visual changes: add the `visual-change` label to the PR; it
    # tolerates only the Compare step, never the accessibility check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build pull request
        run: npm run build

      - name: Accessibility (WCAG 2.1 AA)
        run: node tools/check-accessibility.mjs --dist dist

      - name: Build base branch
        run: |
          git worktree add ../visual-base "origin/${{ github.base_ref }}"
          cd ../visual-base
          npm ci
          npx vite build --outDir "$GITHUB_WORKSPACE/dist-base"

      - name: Compare
        id: compare
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: node tools/visual-regression.mjs --base dist-base --head dist --out visual-report

      - name: Upload screenshots of changed states
        if: always() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: visual-report

  rls:
    # Row-level security check (supabase/tests/rls_tenant_isolation.sql) and PL/pgSQL
    # function check (supabase/tests/plpgsql_functions_check.sql) against the real database.
    # The test runs in one transaction that is always rolled back, so it leaves no data behind.
    # It runs only when the repository has the SUPABASE_DB_URL secret (Supabase → Project
    # Settings → Database → Connection string, "Session pooler" URI with the password).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        if: env.SUPABASE_DB_URL != ''
        uses: actions/checkout@v4

      - name: Tenant and department isolation
        if: env.SUPABASE_DB_URL != ''
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          output=$(psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=0 -f supabase/tests/rls_tenant_isolation.sql 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q 'RLS_PASS'

      - name: PL/pgSQL functions compile against the real schema
        if: env.SUPABASE_DB_URL != ''
        # plpgsql_check finds what fails only when a function runs (a missing
        # column, a wrong type). Rolled back, like the isolation check.
        run: |
          output=$(psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=0 -f supabase/tests/plpgsql_functions_check.sql 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q 'PLPGSQL_CHECK_PASS'

      - name: Skipped (no SUPABASE_DB_URL secret)
        if: env.SUPABASE_DB_URL == ''
        run: echo "Add the SUPABASE_DB_URL repository secret to run the row-level security and PL/pgSQL function checks."
