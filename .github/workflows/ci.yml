name: Limoxis Observer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: limoxis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22.22.2
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install
        run: npm ci

      - name: Full check
        run: npm run check
