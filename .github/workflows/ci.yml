name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clinical i18n audit
        run: npm run audit:clinical-i18n

      - name: Laboratory i18n audit
        run: npm run audit:lab-i18n

      - name: Product i18n audit
        run: npm run audit:product-i18n

      - name: Permission audit
        run: npm run audit:product-permissions

      - name: Navigation audit
        run: npm run audit:navigation

      - name: React hooks audit
        run: npm run audit:hooks

      - name: Observer UI audit
        run: npm run audit:observer-ui

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
