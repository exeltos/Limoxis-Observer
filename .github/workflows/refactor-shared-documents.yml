name: Refactor shared documents workspace
on:
  workflow_dispatch:
  push:
    branches: [refactor/shared-documents-workspace]
    paths:
      - scripts/refactor_shared_documents.py
jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-documents-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refactor_shared_documents.py
      - run: rm scripts/refactor_shared_documents.py .github/workflows/refactor-shared-documents.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use one shared documents workspace" || exit 0
          git push
