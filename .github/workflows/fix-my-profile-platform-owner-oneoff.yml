name: Fix my profile platform owner one off
on:
  push:
    paths:
      - .github/workflows/fix-my-profile-platform-owner-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-my-profile-platform-owner.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/employees/EmployeeRecordPage.jsx src/styles/my-profile.css
          git commit -m "fix(profile): separate platform owner from employee self profile" || exit 0
          git push
