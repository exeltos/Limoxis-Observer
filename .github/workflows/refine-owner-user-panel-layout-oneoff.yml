name: Refine owner user panel layout one off

on:
  push:
    paths:
      - .github/workflows/refine-owner-user-panel-layout-oneoff.yml
      - scripts/refine-owner-user-panel-layout.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/refine-owner-user-panel-layout.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/styles/design-system-layouts.css
          git commit -m "fix(owner): compact selected user management panel" || exit 0
          git push
