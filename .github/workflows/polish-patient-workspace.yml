name: Polish patient workspace
on:
  workflow_dispatch:
  push:
    branches: [fix/patient-workspace-hierarchy-flow]
    paths:
      - scripts/polish_patient_workspace.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-workspace-hierarchy-flow
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: python scripts/polish_patient_workspace.py
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit refinements
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-workspace-polish.css src/main.jsx
          git diff --cached --quiet || git commit -m "Polish patient workspace hierarchy and preserve surveillance flow"
          git push
