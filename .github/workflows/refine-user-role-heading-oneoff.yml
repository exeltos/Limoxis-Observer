name: Refine user role heading one off
on:
  push:
    paths:
      - .github/workflows/refine-user-role-heading-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/refine-user-role-heading.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/styles/design-system-layouts.css
          git commit -m "fix(owner): refine user roles heading typography" || exit 0
          git push
