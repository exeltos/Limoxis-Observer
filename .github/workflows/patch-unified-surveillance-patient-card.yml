name: Patch unified surveillance patient card
on:
  push:
    branches:
      - feat/unified-surveillance-patient-card
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-surveillance-patient-card
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fix patch locator and apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_unified_surveillance.py')
          s=p.read_text()
          old="nr=block.rfind('return <div className=\"patient-surveillance-clean\"')"
          new="nr=block.index('return <div className=\"workspace-column workspace-fill patient-surveillance-clean\"')"
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python scripts/patch_unified_surveillance.py
      - name: Test and build
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
          git diff --cached --check
          git commit -m "Unify surveillance samples and expand patient details"
          git push origin HEAD:feat/unified-surveillance-patient-card
