name: Validate unified surveillance patient card
on:
  push:
    branches:
      - feat/unified-surveillance-patient-card
permissions:
  contents: write
jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-surveillance-patient-card
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove obsolete guide
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          s=p.read_text()
          start=s.find('function SurveillanceStartGuide(')
          if start>=0:
            end=s.find('\nfunction SimpleDialog(',start)
            if end<0: raise SystemExit('SimpleDialog marker missing')
            s=s[:start]+s[end+1:]
            p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx
          git diff --cached --check
          git commit -m "Remove obsolete surveillance guide"
          git push origin HEAD:feat/unified-surveillance-patient-card
