name: Unify self profile one off
on:
  push:
    paths:
      - .github/workflows/unify-self-profile-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/unify-self-profile-with-employee-tabs.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/employees/EmployeeRecordPage.jsx src/core/i18n/LanguageContext.jsx
          git commit -m "fix(profile): unify account summary with employee self tabs" || exit 0
          git push
