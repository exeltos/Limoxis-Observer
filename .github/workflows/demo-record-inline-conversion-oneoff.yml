  if (patch.validUntil !== undefined || patch.valid_until !== undefined) payload.valid_until = patch.validUntil ?? patch.valid_until
  if (patch.status !== undefined) payload.status = patch.status
  payload.updated_at = new Date().toISOString()

  if (patch.organizationId) {
    const organizationPayload = {}
    if (patch.label !== undefined) organizationPayload.name = String(patch.label || '').trim()
    if (patch.type !== undefined) organizationPayload.type = patch.type || 'hospital'
    if (patch.region !== undefined) organizationPayload.region = patch.region || null
    if (patch.healthRegion !== undefined || patch.health_region !== undefined) organizationPayload.health_region = patch.healthRegion ?? patch.health_region ?? null
    if (patch.city !== undefined) organizationPayload.city = patch.city || null
    if (patch.country !== undefined) organizationPayload.country = patch.country || null
    if (patch.contactEmail !== undefined || patch.contact_email !== undefined) organizationPayload.contact_email = String(patch.contactEmail ?? patch.contact_email ?? '').trim().toLowerCase() || null
    if (patch.contactPhone !== undefined || patch.contact_phone !== undefined) organizationPayload.contact_phone = patch.contactPhone ?? patch.contact_phone ?? null
    if (patch.bedCapacity !== undefined || patch.bed_capacity !== undefined) {
      const value = patch.bedCapacity ?? patch.bed_capacity
      organizationPayload.bed_capacity = value === '' || value == null ? null : Number(value) || null
    }
    if (Object.keys(organizationPayload).length) {
      organizationPayload.updated_at = new Date().toISOString()
      const { error: organizationError } = await supabase.from('organizations').update(organizationPayload).eq('id', patch.organizationId).eq('is_demo', true)
      if (organizationError) throw organizationError
    }
  }

  const { data, error } = await supabase.from('platform_demo_entitlements').update(payload).eq('id', demoId).select('id,label,contact_name,contact_email,valid_from,valid_until,status,organization_id,demo_user_id,organization:organizations(id,name,code,type,status,region,health_region,city,country,contact_email,contact_phone,bed_capacity,is_demo)').single()
  if (error) throw error
  return data
}
