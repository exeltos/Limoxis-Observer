    updated_at: new Date().toISOString(),
  }
  if (!organizationPayload.name) delete organizationPayload.name
  const { data: organization, error: organizationError } = await supabase.from('organizations').update(organizationPayload).eq('id', organizationId).eq('is_demo', true).select('id,name,code,type,status,region,health_region,city,country,contact_email,contact_phone,bed_capacity,is_demo').single()
