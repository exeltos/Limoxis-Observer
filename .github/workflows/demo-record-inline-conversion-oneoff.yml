          if addition not in s:
              s=s.replace(anchor,anchor+addition,1)
          s=s.replace("  .platform-form-grid:has(>.manual-date-field){grid-template-columns:repeat(2,minmax(0,1fr))}\n", "  .platform-form-grid:has(>.manual-date-field){grid-template-columns:repeat(2,minmax(0,1fr))}\n  .platform-demo-access-grid{grid-template-columns:repeat(2,minmax(0,1fr))}\n")
          s=s.replace("  .platform-form-grid,.platform-demo-edit-grid,.platform-form-grid:has(>.manual-date-field){grid-template-columns:1fr}\n", "  .platform-form-grid,.platform-demo-edit-grid,.platform-form-grid:has(>.manual-date-field),.platform-demo-access-grid{grid-template-columns:1fr}\n")
          p.write_text(s,encoding='utf-8')

          wf=Path('.github/workflows/demo-record-inline-conversion-oneoff.yml')
          wf.unlink()
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit patch
        run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/core/tenant/tenantService.js src/features/platform/PlatformDemoRecord.jsx src/features/workspaces/PlatformCenterPage.jsx src/styles/platform-owner-polish.css .github/workflows/demo-record-inline-conversion-oneoff.yml
          git commit -m "feat(owner): make demo records full editable workspaces"
          git push origin main