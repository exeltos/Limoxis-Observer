name: Apply patient record cleanup
on:
  push:
    branches: [refactor/patient-record-cleanup]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patient-cleaned]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/patient-record-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: python scripts/cleanup_patient_record.py
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/styles/patient-record.css
          git commit -m "Clean patient record layout [patient-cleaned]"
          git push
