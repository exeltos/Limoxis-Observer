name: Apply patient admission tabs cleanup
on:
  push:
    branches: [fix/patient-admission-tabs-cleanup]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tabs-patched]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-admission-tabs-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: python scripts/fix_patient_admission_tabs.py
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx
          git commit -m "Restore admission clinical tabs [tabs-patched]"
          git push
