name: Platform Owner Phase 1 Refactor

on:
  push:
    branches:
      - refactor/platform-owner-phase1
    paths:
      - scripts/refactor-platform-owner-phase1.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: node scripts/refactor-platform-owner-phase1.mjs
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/workspaces/PlatformCenterPage.jsx src/features/platform/PlatformOrganizationRecord.jsx src/styles/platform-owner-polish.css tests/platformOwnerCanonicalAnalytics.test.js
          git commit -m "refactor(platform): canonicalize owner analytics"
          git push
