name: Finalize owner record layout one off
on:
  push:
    paths:
      - .github/workflows/finalize-owner-record-layout-oneoff.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/finalize-owner-record-layout.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/platform/PlatformOrganizationRecord.jsx src/features/platform/PlatformDemoRecord.jsx src/styles/design-system-layouts.css
          git commit -m "fix(owner): finalize record actions users and demo contact layout" || exit 0
          git push
