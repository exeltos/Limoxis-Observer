name: Apply visible surveillance fix
on:
  push:
    branches: [fix/surveillance-visible-polish]
    paths: [.github/workflows/apply-visible-surveillance-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-visible-polish
      - name: Patch patient surveillance UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/features/surveillance/PatientClinicalCanonicalPage.jsx')
          s=p.read_text()
          s=s.replace("function TagList({title,items=[],t,language}){if(!items?.length)return null;return <><h4>{title}</h4><div className=\"tag-row\">{items.map(x=><span className=\"clinical-tag\" key={x}>{clinicalValueLabel(x,language,t)}</span>)}</div></>}","function TagList({title,items=[],t,language}){if(!items?.length)return null;return <><h4>{title}</h4><div className=\"tag-row\">{items.map(x=><span className=\"clinical-tag\" key={x}>{clinicalTerm(x,language)}</span>)}</div></>}")
          s=s.replace("value={clinicalValueLabel(assessment?.classification,language,t)}","value={clinicalTerm(assessment?.classification,language)}")
          s=s.replace("value={lastReview?.status?t(lastReview.status):'—'}","value={clinicalTerm(lastReview?.status,language)}")
          s=s.replace("<Button variant=\"secondary\" onClick={()=>{setFollowUpParent(null);setSampleOpen(true)}}>+ {language==='el'?'Νέο δείγμα':'New sample'}</Button>","<Button className=\"clinical-add-action\" variant=\"secondary\" onClick={()=>{setFollowUpParent(null);setSampleOpen(true)}}><Microscope size={15}/>{language==='el'?'Νέο δείγμα':'New sample'}</Button>")
          s=s.replace("<Button onClick={onEditAssessment}>{language==='el'?'Επεξεργασία αξιολόγησης':'Edit assessment'}</Button>","<Button className=\"clinical-edit-action\" variant=\"secondary\" onClick={onEditAssessment}><Activity size={15}/>{language==='el'?'Επεξεργασία κλινικής αξιολόγησης':'Edit clinical assessment'}</Button>")
          s=s.replace("const win=window.open('','_blank','noopener,noreferrer')\n  if(!win)return","const win=window.open('','_blank')\n  if(!win){window.alert(L('Το πρόγραμμα περιήγησης εμπόδισε το άνοιγμα της αναφοράς. Επιτρέψτε τα αναδυόμενα παράθυρα για το Limoxis Observer.','The browser blocked the report window. Allow pop-ups for Limoxis Observer.'));return}")
          p.write_text(s)
          css=Path('src/styles/surveillance-dropdown-fix.css')
          c=css.read_text()
          c += '''\n/* Clinical action hierarchy */\n.clinical-add-action,.clinical-edit-action,.clinical-primary-action{display:inline-flex!important;align-items:center;gap:.45rem;font-weight:650;min-height:36px;border-radius:9px;box-shadow:0 1px 2px rgba(15,45,70,.08)}\n.clinical-add-action{border-color:#9fc8e8!important;background:#f2f8fd!important;color:#145d91!important}\n.clinical-add-action:hover{background:#e5f2fc!important;border-color:#72add8!important}\n.clinical-edit-action{border-color:#c6d6e3!important;background:#fff!important;color:#284d69!important}\n.clinical-primary-action{box-shadow:0 2px 5px rgba(20,93,145,.16)}\n'''
          css.write_text(c)
          wf=Path('.github/workflows/apply-visible-surveillance-fix.yml')
          wf.unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix visible surveillance terminology report and actions"
          git push origin HEAD:fix/surveillance-visible-polish
