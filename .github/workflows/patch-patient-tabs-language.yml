name: Patient tabs terminology refinement
on:
  push:
    branches:
      - fix/patient-tabs-language-attachments
    paths:
      - .github/workflows/patch-patient-tabs-language.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-tabs-language-attachments
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply terminology patch
        run: python scripts/patch_patient_tab_language.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-patient-tabs-language.yml scripts/patch_patient_tab_language.py
          git add src/features/surveillance/PatientClinicalCanonicalPage.jsx src/design-system/EntityAttachmentsPanel.jsx
          git diff --cached --check
          git commit -m "Polish patient terminology and attachments"
          git push origin HEAD:fix/patient-tabs-language-attachments
