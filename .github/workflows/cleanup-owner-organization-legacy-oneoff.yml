name: Cleanup owner organization legacy one off

on:
  push:
    paths:
      - .github/workflows/cleanup-owner-organization-legacy-oneoff.yml
      - scripts/cleanup-owner-organization-legacy.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/cleanup-owner-organization-legacy.mjs
      - run: |
          git config user.name "Exeltos"
          git config user.email "info@exeltos.com"
          git add src/features/workspaces/PlatformCenterPage.jsx
          git commit -m "refactor(owner): remove legacy organization record path" || exit 0
          git push
