name: Patch surveillance library dropdowns

on:
  push:
    branches:
      - fix/surveillance-library-dropdowns
    paths:
      - .github/workflows/patch-surveillance-library-dropdowns.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surveillance-library-dropdowns
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Convert clinical library cards to compact dropdown lists
        shell: python
        run: |
          from pathlib import Path

          path=Path('src/features/surveillance/NewSurveillanceFlow.jsx')
          text=path.read_text()
          old='''function LibraryChecklist({title,rows,selected,onToggle,language}){\n  return <section className="clinical-checklist library-checklist"><h4>{title}</h4><div className="clinical-library-list">{rows.map(row=>{const value=libraryValue(row);return <label key={value} className={selected.includes(value)?'selected':''}><input type="checkbox" checked={selected.includes(value)} onChange={()=>onToggle(value)}/><span>{language==='el'?(row[0]||row[1]):(row[1]||row[0])}</span></label>})}</div></section>\n}'''
          new='''function LibraryChecklist({title,rows,selected,onToggle,language}){\n  const selectedLabels=rows.filter(row=>selected.includes(libraryValue(row))).map(row=>language==='el'?(row[0]||row[1]):(row[1]||row[0]))\n  const summary=selectedLabels.length?`${selectedLabels.length} ${language==='el'?'επιλεγμένα':'selected'}`:(language==='el'?'Επιλέξτε από τη λίστα':'Select from list')\n  return <details className="clinical-checklist library-checklist library-dropdown"><summary><span><strong>{title}</strong><small>{summary}</small></span><span className="library-dropdown-chevron">⌄</span></summary><div className="clinical-library-list library-dropdown-list">{rows.map(row=>{const value=libraryValue(row);return <label key={value} className={selected.includes(value)?'selected':''}><input type="checkbox" checked={selected.includes(value)} onChange={()=>onToggle(value)}/><span>{language==='el'?(row[0]||row[1]):(row[1]||row[0])}</span></label>})}</div>{selectedLabels.length>0&&<div className="library-dropdown-selected">{selectedLabels.map(label=><span key={label}>{label}</span>)}</div>}</details>\n}'''
          if old not in text:
              raise SystemExit('LibraryChecklist anchor not found')
          path.write_text(text.replace(old,new,1))

          css_rule='''\n/* Compact dropdown selectors for surveillance clinical libraries */\n.library-clinical-grid{align-items:start}\n.library-dropdown{position:relative;border:1px solid var(--border-color,#d8e2ea);border-radius:12px;background:#fff;overflow:visible}\n.library-dropdown>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:10px 14px}\n.library-dropdown>summary::-webkit-details-marker{display:none}\n.library-dropdown>summary>span:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}\n.library-dropdown>summary strong{font-size:14px}\n.library-dropdown>summary small{font-size:12px;font-weight:500;color:var(--text-muted,#6b7f91)}\n.library-dropdown-chevron{font-size:20px;line-height:1;transition:transform .15s ease}\n.library-dropdown[open] .library-dropdown-chevron{transform:rotate(180deg)}\n.library-dropdown-list{max-height:270px;overflow:auto;border-top:1px solid var(--border-color,#e2e8ee);padding:6px;background:#fff;display:flex;flex-direction:column;gap:0}\n.library-dropdown-list label{display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 9px;border-radius:7px;cursor:pointer}\n.library-dropdown-list label:hover{background:var(--surface-subtle,#f5f8fa)}\n.library-dropdown-list label input{flex:0 0 auto;margin:0}\n.library-dropdown-list label span{text-align:left}\n.library-dropdown-selected{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--border-color,#e2e8ee)}\n.library-dropdown-selected span{font-size:11px;padding:3px 7px;border-radius:999px;background:var(--surface-subtle,#eef5f8);color:var(--text-secondary,#526779)}\n@media (max-width:900px){.library-clinical-grid{grid-template-columns:1fr}.library-dropdown-list{max-height:220px}}\n'''
          css_files=list(Path('src').rglob('*.css'))
          target=None
          for p in css_files:
              s=p.read_text(errors='ignore')
              if '.clinical-library-list' in s or '.library-clinical-grid' in s:
                  target=p;break
          if target is None:
              target=Path('src/index.css') if Path('src/index.css').exists() else css_files[0]
          css=target.read_text()
          if 'Compact dropdown selectors for surveillance clinical libraries' not in css:
              target.write_text(css+css_rule)
          print(f'Patched JSX and CSS: {target}')
      - name: Test and build
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/surveillance/NewSurveillanceFlow.jsx src/**/*.css
          git diff --cached --check
          git commit -m "Use compact library dropdowns in surveillance assessment"
          git push origin HEAD:fix/surveillance-library-dropdowns
